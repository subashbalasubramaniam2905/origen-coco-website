hed in front of you, with a printed slip.",ta:"உங்கள் முன்னிலையில் முத்திரையிட்ட டிஜிட்டல் தராசில் எடை, அச்சிட்ட ரசீது."},why4t:{en:"Modern Processing",ta:"நவீன பதப்படுத்தல்"},why4d:{en:"Mechanised dehusking, grading and copra drying keep quality and prices steady.",ta:"இயந்திர உரிப்பு, தரம் பிரிப்பு, கொப்பரை உலர்த்தல் மூலம் நிலையான தரம்."},why5t:{en:"Reliable Payments",ta:"நம்பகமான பணம்"},why5d:{en:"Paid by bank transfer or UPI on the day of purchase.",ta:"வாங்கிய அதே நாளில் வங்கி அல்லது UPI மூலம் பணம்."},why6t:{en:"Long-Term Relationships",ta:"நீண்டகால உறவு"},why6d:{en:"Seasonal contracts and advance booking for regular suppliers.",ta:"தொடர் விற்பனையாளர்களுக்கு பருவ ஒப்பந்தம் மற்றும் முன்பதிவு."},processEyebrow:{en:"From your grove to our yard",ta:"உங்கள் தோப்பிலிருந்து எங்கள் களத்திற்கு"},processTitle:{en:"How we procure and process",ta:"எங்கள் கொள்முதல் மற்றும் பதப்படுத்தல்"},processSub:{en:"Every load is handled by our own team, from the climb to the warehouse, so the price we quote is the price you get.",ta:"மரம் ஏறுவதிலிருந்து கிடங்கு வரை எங்கள் குழுவே கையாள்கிறது. சொன்ன விலையே கிடைக்கும்."},p1t:{en:"Collection",ta:"சேகரிப்பு"},p1d:{en:"Our harvest teams and trucks collect directly from groves across the western and delta districts.",ta:"மேற்கு மற்றும் டெல்டா மாவட்ட தோப்புகளிலிருந்து நேரடியாக சேகரிக்கிறோம்."},p2t:{en:"Sorting & grading",ta:"தரம் பிரித்தல்"},p2d:{en:"Nuts are graded by size and maturity on arrival, so you are paid for what you actually supply.",ta:"வந்தவுடன் அளவு, முற்றல் அடிப்படையில் தரம் பிரிக்கப்படுகிறது."},p3t:{en:"Processing",ta:"பதப்படுத்தல்"},p3d:{en:"Mechanised dehusking and hygienic copra drying yards.",ta:"இயந்திர உரிப்பு மற்றும் சுகாதாரமான கொப்பரை உலர் களம்."},p4t:{en:"Storage",ta:"சேமிப்பு"},p4d:{en:"Ventilated warehouses keep stock fresh until dispatch.",ta:"காற்றோட்டமான கிடங்குகளில் சேமிப்பு."},p5t:{en:"Coconut products",ta:"தேங்காய் பொருட்கள்"},p5d:{en:"Husked coconuts, milling copra and coconut oil supplied to traders and mills
